<!doctype html>
<html lang="pt-BR">
<head>

  <title>GestorPro — visão geral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="personal.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#inicio" aria-label="GestorPro início"><span class="brand-mark">G</span><span>gestor<span class="brand-light">pro</span></span></a>
      <div class="workspace-switch"><span class="workspace-icon">R$</span><span><b>Minhas finanças</b><small>Uso pessoal</small></span><span class="chevron">⌄</span></div>
      <div class="nav-label">MENU PRINCIPAL</div>
      <nav class="main-nav" aria-label="Menu principal">
        <button class="nav-item active" data-page="inicio"><span class="nav-icon">◫</span>Visão geral</button>
        <button class="nav-item" data-page="contas"><span class="nav-icon">▣</span>Minhas contas <span class="nav-count">3</span></button>
        <button class="nav-item" data-page="lancamentos"><span class="nav-icon">⇄</span>Lançamentos</button>

        <button class="nav-item" data-page="relatorios"><span class="nav-icon">▥</span>Análise financeira</button>
      </nav>
      <div class="nav-label tools-label">PREFERÊNCIAS</div>

      <div class="page-wrap" id="page-content"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="modal" class="modal"><form method="dialog" id="modal-form"><button class="modal-close" type="button" aria-label="Fechar">×</button><div id="modal-content"></div></form></dialog>
