services:
  - type: web
    name: gestorpro
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PLUGGY_INCLUDE_SANDBOX
        value: "false"
      - key: GESTORPRO_ALLOWED_GOOGLE_EMAIL
        value: ruandiasmaiasilva@gmail.com
      - key: PLUGGY_CLIENT_ID
        sync: false
      - key: PLUGGY_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
